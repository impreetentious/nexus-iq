# Optional local runtime for the public Nexus IQ app. Nothing here is required to
# run Nexus IQ from source.
# Named volumes persist project bundles, PII re-identification vaults, and
# provider config across container recreation.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NXQ_PORT: "7341"
    command: npm run start:docker
    volumes:
      - projects:/app/projects
      - vaults:/app/vaults
      - config:/app/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  projects:
  vaults:
  config:
