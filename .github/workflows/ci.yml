name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Pin by full commit SHA (supply-chain hardening). Tags in comments for humans.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version coherence
        run: npm run check:version

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (Next.js shell)
        run: npm run build

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility suite (Playwright + axe)
        run: npm run test:a11y

      - name: Dependency audit
        run: npm audit --audit-level=high

  docker-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Single Node matrix is enough for the image smoke; keep permissions tight.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Docker smoke (build + /api/health)
        run: npm run docker:smoke
