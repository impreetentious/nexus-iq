name: Release

# This repository does not carry git tags; versions are traced by commit
# subject and the **Version:** block in README.md. The release is therefore
# driven manually from a commit, and the version comes from package.json
# (which `npm run check:version` already keeps in sync with the lockfile and
# the README).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional guard: expected version, e.g. 2.11.0. Blank uses package.json."
        required: false
        type: string
      ref:
        description: "Commit SHA or branch to release from. Blank uses the default branch."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history so release notes can diff against the previous release.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:version

      - name: Resolve release version and target commit
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          requested="${REQUESTED_VERSION#v}"
          if [ -n "$requested" ] && [ "$requested" != "$package_version" ]; then
            echo "::error::requested version $requested does not match package.json ($package_version)"
            exit 1
          fi
          target_sha="$(git rev-parse HEAD)"
          {
            echo "version=$package_version"
            echo "tag=v$package_version"
            echo "sha=$target_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$package_version from $target_sha"

      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm audit --audit-level=high
      - run: npm run docker:smoke

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG already exists; bump the version before releasing"
            exit 1
          fi
          # `gh release create` creates the release tag at --target, so nothing
          # needs to be tagged beforehand.
          previous="$(gh release list --limit 1 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            echo "Diffing release notes against $previous"
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            # First release: there is no earlier release to diff against, so
            # publish a plain body instead of letting note generation fail the run.
            echo "No previous release found; publishing without generated notes."
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TAG" \
              --notes "First tracked release of nexus-iq. Built from \`$TARGET_SHA\`."
          fi
