name: Release

on:
  push:
    tags:
      - "v*"
  # The tag trigger was the only trigger, so this job had never run once across
  # 44 versioned commits. Manual dispatch lets it be exercised without inventing
  # a historical tag; it requires the tag to already exist and to be checked out.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          # `--generate-notes` needs the history behind the tag to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:version

      # A mistyped tag must fail here, not after a release object already exists.
      - name: Assert the tag matches package.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json ($expected)"
            exit 1
          fi
          echo "tag $RELEASE_TAG matches package.json"

      - run: npm run build
      - run: npm test

      # Notes are generated from the commits in the tag range. This repo keeps no
      # README changelog — the commit history is the release record, matching every
      # sibling repo. On the first-ever release there is no previous tag to diff
      # against, so the notes enumerate the whole history; that is accepted rather
      # than pinned with --notes-start-tag, which would need a tag that does not
      # exist yet.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
